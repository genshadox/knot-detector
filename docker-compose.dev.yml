services:
  runner:

    container_name: smarti

    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
          UID: ${UID:-1000}
          GID: ${GID:-1000}

    env_file:
      - .env

    volumes:
      - ./src:/src
      - ${LOG_DIR_PATH}:/data/logs
      - ${INPUT_DIR_PATH}:/data/input
      - ${OUTPUT_DIR_PATH}:/data/output
      - ${TEST_DIR_PATH}:/data/test_input
    
    ports:
      - 5678:5678 # debug port