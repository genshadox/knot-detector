services:
  runner:

    container_name: smarti

    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
          UID: ${UID:-1000}
          GID: ${GID:-1001}

    env_file:
      - .env

    volumes:
      - ./src:/src
      - ${LOG_DIR_PATH}:/data/logs
    
    ports:
      - 5678:5678 # debug port